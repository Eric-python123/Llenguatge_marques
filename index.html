<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de un partido</title>
    <link rel="stylesheet" href="estils.css">
</head>

<body>
    <header>
        <h1>Gestión del Partido</h1>
    </header>
    <main>
        <section>
            <h2>Marcador Chulo</h2>
            <div class="marcador">
                <div>
                    <h3>Equipo 1</h3>
                    <p id="puntos1">0</p>
                    <button id="sumar1">+1 punto</button>
                </div>


                <div>
                    <h3>Equipo 2</h3>
                    <p id="puntos2">0</p>
                    <button id="sumar2">+1 punto</button>
                </div>
            </div>

            <button id="reiniciar">Reiniciar marcador</button>
            
            <p id="mensaje" aria-live="polite"></p>
        </section>

        <section>
            <h2>Jugadores</h2>

            <form id="formJugador">
                <label for="nombreJugador">Nombre del jugador:</label>
                <input type="text" id="nombreJugador">
                <button type="submit">Añadir</button>
            </form>

            <ul id="listaJugadores"></ul>
        </section>

    </main>

    <footer>
        <p>Club deportivo</p>
    </footer>

    <script src="gestor_partit.js"></script>
</body>

</html>
