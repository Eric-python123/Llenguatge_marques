<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Evento Molón</title>
    <link rel="stylesheet" href="estils.css">
</head>
<body>

<header>
    <h1>Registro al Evento Tecnológico Molón</h1>
</header>

<form id="formulario">

    <label for="nombre">Nombre completo</label>
    <input type="text" id="nombre" required
           pattern="[A-Za-z ]+">
    <div class="error" id="errorNombre"></div>

    <label for="email">Correo electrónico</label>
    <input type="email" id="email" required>
    <div class="error" id="errorEmail"></div>

    <label for="edad">Edad</label>
    <input type="number" id="edad" min="18" max="120" required>
    <div class="error" id="errorEdad"></div>

    <label for="fecha">Fecha del evento</label>
    <input type="date" id="fecha" required>
    <div class="error" id="errorFecha"></div>

    <label for="entrada">Tipo de entrada</label>
    <select id="entrada" required>
        <option value="">Selecciona una opción</option>
        <option value="general">General</option>
        <option value="vip">VIP</option>
    </select>
    <div class="error" id="errorEntrada"></div>

    <label for="comentarios">Comentarios</label>
    <textarea id="comentarios" rows="4" minlength="10" required></textarea>
    <div class="error" id="errorComentarios"></div>

    <button type="submit">Enviar</button>

    <div class="success" id="mensajeFinal"></div>
</form>

<script src="validacion.js"></script>
</body>
</html>
